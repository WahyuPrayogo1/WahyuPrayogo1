<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Wahyu Prayogo</title>
  <desc id="desc">A dark editorial banner for a full-stack software engineer, with cyan and violet geometric orbit artwork.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#07101e" />
      <stop offset="1" stop-color="#11152c" />
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop offset="0" stop-color="#40e6dc" />
      <stop offset="1" stop-color="#a79bff" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#26354f" stroke-width="1" opacity=".35" />
    </pattern>
    <clipPath id="frame"><rect width="1200" height="390" rx="22" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="390" fill="url(#background)" />
    <rect width="1200" height="390" fill="url(#grid)" />
    <path d="M0 1h1200M0 389h1200" stroke="#33425b" stroke-opacity=".65" />
    <path d="M40 38v314" stroke="#40e6dc" stroke-width="4" />

    <g fill="none" stroke="#40e6dc" stroke-opacity=".27">
      <circle cx="930" cy="192" r="174" />
      <circle cx="930" cy="192" r="130" />
      <circle cx="930" cy="192" r="84" />
      <path d="M722 192h416M930-16v416" />
    </g>
    <path d="M930 18a174 174 0 0 1 161 109" fill="none" stroke="url(#accent)" stroke-width="3" />
    <path d="M806 313a174 174 0 0 1-39-47" fill="none" stroke="#a79bff" stroke-width="3" />
    <circle cx="1091" cy="127" r="6" fill="#40e6dc" />
    <circle cx="806" cy="313" r="5" fill="#a79bff" />

    <g transform="translate(930 192) rotate(45)">
      <rect x="-58" y="-58" width="116" height="116" rx="8" fill="#101e33" stroke="url(#accent)" stroke-width="3" />
      <rect x="-31" y="-31" width="62" height="62" rx="5" fill="#1b3650" stroke="#40e6dc" stroke-width="2" />
      <circle r="8" fill="#40e6dc" />
    </g>
    <path d="M730 192h76M1054 192h76" stroke="#40e6dc" stroke-width="2" stroke-dasharray="4 8" />

    <text x="72" y="70" fill="#40e6dc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="68" y="192" fill="#f1f6ff" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="-5">WAHYU</text>
    <text x="68" y="290" fill="#f1f6ff" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="-5">PRAYOGO<tspan fill="#40e6dc">.</tspan></text>
    <path d="M72 322h480" stroke="url(#accent)" stroke-width="2" />
    <text x="72" y="354" fill="#a9bad5" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">LARAVEL  /  REACT  /  SYSTEM DESIGN</text>
    <text x="1068" y="355" fill="#a9bad5" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">WP / 01</text>
  </g>
</svg>
