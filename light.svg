<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="280" viewBox="0 0 1180 280" role="img" aria-label="Wahyu Prayogo, Software Engineer. Laravel, React, and system design. Open to work.">
  <title>Wahyu Prayogo — Software Engineer</title>
  <desc>A simple light profile banner with name, role, core skills, and a subtle code symbol.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eaf3fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087f91"/>
      <stop offset="1" stop-color="#5d63c3"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9dbed4" stroke-opacity=".13"/>
    </pattern>
    <clipPath id="frame"><rect width="1180" height="280" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1180" height="280" fill="url(#background)"/>
    <rect width="1180" height="280" fill="url(#grid)"/>
    <rect x="1" y="1" width="1178" height="278" rx="23" fill="none" stroke="#b9d1e2" stroke-width="2"/>
    <path d="M48 44v192" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="67" fill="#087f91" font-family="Consolas, Menlo, Monaco, monospace" font-size="14" font-weight="700" letter-spacing="3">GITHUB / PROFILE</text>
    <text x="74" y="145" fill="#172b40" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Wahyu Prayogo</text>
    <text x="78" y="187" fill="#087f91" font-family="Consolas, Menlo, Monaco, monospace" font-size="22" font-weight="700" letter-spacing="1.5">SOFTWARE ENGINEER</text>
    <path d="M78 208h555" stroke="#b9d1e2" stroke-width="1.5"/>
    <text x="78" y="238" fill="#536d83" font-family="Consolas, Menlo, Monaco, monospace" font-size="15">Laravel  /  React  /  System Design</text>

    <circle cx="963" cy="140" r="93" fill="#d1e4f0" fill-opacity=".35" stroke="#b9d1e2" stroke-width="2"/>
    <circle cx="963" cy="140" r="70" fill="none" stroke="#087f91" stroke-opacity=".28" stroke-width="1.5"/>
    <path d="M929 121l-21 19 21 19M997 121l21 19-21 19M977 109l-28 62" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="920" cy="251" r="5" fill="#087f91"><animate attributeName="opacity" values="1;.55;1" dur="4s" repeatCount="indefinite"/></circle>
    <text x="935" y="256" fill="#536d83" font-family="Consolas, Menlo, Monaco, monospace" font-size="12">OPEN TO WORK</text>
  </g>
</svg>
