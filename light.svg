<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Wahyu Prayogo, Software Engineer. Laravel, React, and system design. Open to work.">
  <title>Wahyu Prayogo — Software Engineer</title>
  <desc>A light terminal-inspired profile banner with a system design visual map and a concise engineering profile.</desc>
  <defs>
