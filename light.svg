<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="370" viewBox="0 0 1180 370" role="img" aria-label="Wahyu Prayogo, Software Engineer. I design web systems and build them with Laravel and React.">
  <title>Wahyu Prayogo — Software Engineer</title>
  <desc>A light engineering profile banner with a visual path from system design to Laravel and React.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f2fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087d92"/>
      <stop offset="1" stop-color="#655ac5"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#a1dce0" stop-opacity=".24"/>
      <stop offset="1" stop-color="#a1dce0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#9db8d0" stroke-opacity=".16"/>
    </pattern>
    <clipPath id="frame"><rect width="1180" height="370" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1180" height="370" fill="url(#background)"/>
    <rect width="1180" height="370" fill="url(#grid)"/>
    <circle cx="929" cy="185" r="245" fill="url(#halo)"/>
    <rect x="1" y="1" width="1178" height="368" rx="23" fill="none" stroke="#bfd2e3" stroke-width="2"/>
    <path d="M43 38v292" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M73 79h68" stroke="#087d92" stroke-width="3"/>
    <text x="73" y="66" fill="#087d92" font-family="Consolas, Menlo, Monaco, monospace" font-size="13" font-weight="700" letter-spacing="2.5">WP / ENGINEERING PROFILE</text>

    <text x="70" y="152" fill="#183047" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="800" letter-spacing="-2">Wahyu Prayogo</text>
    <text x="73" y="201" fill="#087d92" font-family="Consolas, Menlo, Monaco, monospace" font-size="26" font-weight="700" letter-spacing="1.5">SOFTWARE ENGINEER</text>
    <path d="M73 220h495" stroke="#bfd2e3" stroke-width="1.5"/>
    <text x="73" y="252" fill="#4b657e" font-family="Arial, Helvetica, sans-serif" font-size="18">I design web systems and build them with</text>
    <text x="73" y="280" fill="#4b657e" font-family="Arial, Helvetica, sans-serif" font-size="18">Laravel and React.</text>

    <rect x="73" y="309" width="163" height="32" rx="9" fill="#e1f1f6" stroke="#bfd2e3"/>
    <rect x="247" y="309" width="111" height="32" rx="9" fill="#e1f1f6" stroke="#bfd2e3"/>
    <rect x="369" y="309" width="94" height="32" rx="9" fill="#e1f1f6" stroke="#bfd2e3"/>
    <text x="154" y="330" text-anchor="middle" fill="#183047" font-family="Consolas, Menlo, Monaco, monospace" font-size="12" font-weight="700">SYSTEM DESIGN</text>
    <text x="302" y="330" text-anchor="middle" fill="#183047" font-family="Consolas, Menlo, Monaco, monospace" font-size="12" font-weight="700">LARAVEL</text>
    <text x="416" y="330" text-anchor="middle" fill="#183047" font-family="Consolas, Menlo, Monaco, monospace" font-size="12" font-weight="700">REACT</text>

    <path d="M625 37v295" stroke="#bfd2e3" stroke-opacity=".65"/>
    <text x="672" y="66" fill="#668098" font-family="Consolas, Menlo, Monaco, monospace" font-size="12" letter-spacing="2">DESIGN  →  BUILD  →  EXPERIENCE</text>
    <circle cx="905" cy="197" r="144" fill="none" stroke="#bfd2e3" stroke-opacity=".42"/>
    <circle cx="905" cy="197" r="111" fill="none" stroke="#087d92" stroke-opacity=".18"/>
    <path d="M905 174v53M905 227h-147v23M905 227h147v23" fill="none" stroke="#5e93ae" stroke-width="2.5" stroke-dasharray="6 7">
      <animate attributeName="stroke-dashoffset" values="0;-26" dur="9s" repeatCount="indefinite"/>
    </path>
    <circle cx="905" cy="227" r="5" fill="#087d92"/>

    <rect x="796" y="109" width="218" height="65" rx="14" fill="#f4f9fe" stroke="#087d92" stroke-width="1.7"/>
    <rect x="805" y="118" width="200" height="47" rx="9" fill="url(#accent)" fill-opacity=".08"/>
    <circle cx="819" cy="141" r="5" fill="#087d92"/>
    <text x="906" y="136" text-anchor="middle" fill="#668098" font-family="Consolas, Menlo, Monaco, monospace" font-size="11" letter-spacing="1.5">01 / PLAN</text>
    <text x="906" y="157" text-anchor="middle" fill="#183047" font-family="Consolas, Menlo, Monaco, monospace" font-size="15" font-weight="700">SYSTEM DESIGN</text>

    <rect x="673" y="250" width="170" height="61" rx="13" fill="#f4f9fe" stroke="#bfd2e3" stroke-width="1.7"/>
    <rect x="967" y="250" width="170" height="61" rx="13" fill="#f4f9fe" stroke="#bfd2e3" stroke-width="1.7"/>
    <circle cx="696" cy="281" r="5" fill="#087d92"/>
    <circle cx="990" cy="281" r="5" fill="#655ac5"/>
    <text x="758" y="276" text-anchor="middle" fill="#668098" font-family="Consolas, Menlo, Monaco, monospace" font-size="11" letter-spacing="1.5">02 / BACKEND</text>
    <text x="758" y="297" text-anchor="middle" fill="#183047" font-family="Consolas, Menlo, Monaco, monospace" font-size="15" font-weight="700">LARAVEL</text>
    <text x="1052" y="276" text-anchor="middle" fill="#668098" font-family="Consolas, Menlo, Monaco, monospace" font-size="11" letter-spacing="1.5">03 / FRONTEND</text>
    <text x="1052" y="297" text-anchor="middle" fill="#183047" font-family="Consolas, Menlo, Monaco, monospace" font-size="15" font-weight="700">REACT</text>
    <circle cx="1102" cy="58" r="5" fill="#087d92"><animate attributeName="opacity" values="1;.45;1" dur="4s" repeatCount="indefinite"/></circle>
    <text x="1088" y="62" text-anchor="end" fill="#668098" font-family="Consolas, Menlo, Monaco, monospace" font-size="11" letter-spacing="1">OPEN TO WORK</text>
  </g>
</svg>
